name: CI - Code Quality & Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-quality:
    name: Backend Linting & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code formatting & linting with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite with pytest & coverage
        run: uv run pytest
        env:
          SECRET_KEY: ci-secret-key-for-testing-only
          DEBUG: "False"

  frontend-quality:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web Component bundle
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f dist/community-widget.js
          test -f dist/community-widget.umd.cjs
