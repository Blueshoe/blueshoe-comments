name: Release - npm & GitHub Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # Required for npm Trusted Publishing (OIDC) and Sigstore Provenance

jobs:
  release-module:
    name: Build & Publish Nuxt Module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11 (match local lockfile)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt module + CSS
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/module.mjs
          test -f dist/types.d.mts
          test -f dist/runtime/assets/css/community.css
          test -s dist/runtime/composables/useCommunityComments.d.ts
          test -s dist/runtime/composables/useCommunityReactions.d.ts
          test -s dist/runtime/composables/useCommunityReactionBatch.d.ts

      - name: Publish to npm (via Trusted Publishing & Provenance)
        run: npm publish --access public --provenance || npm publish --access public

      - name: Create GitHub Release and upload Assets
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            frontend/dist/module.mjs
            frontend/dist/types.d.mts
            frontend/dist/runtime/assets/css/community.css
            frontend/dist/runtime/public/auth-callback.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
