name: Release - npm & GitHub Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # Required for npm Trusted Publishing (OIDC) and Sigstore Provenance

jobs:
  release-widget:
    name: Build & Publish Frontend Widget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build standalone ES-Module & UMD bundle
        run: npm run build

      - name: Publish to npm (via Trusted Publishing & Provenance)
        run: npm publish --access public --provenance

      - name: Create GitHub Release and upload Assets
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            frontend/dist/community-widget.js
            frontend/dist/community-widget.umd.cjs
            frontend/auth-callback.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
